/* Unified knowledge picker and animated SEPM assistant. */
.select-wrap{isolation:isolate;z-index:6}
.category-trigger{width:100%;min-height:50px;display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid #cbdcf1;border-radius:10px;background:#ffffffd9;box-shadow:0 2px 5px #103d7604;color:var(--navy);font-size:.84rem;font-weight:600;text-align:left;transition:border-color .18s,box-shadow .18s,background .18s}
.category-trigger>svg{width:22px;height:22px;color:var(--blue)}
.category-trigger>span{flex:1;min-width:0;white-space:nowrap}
.category-trigger .select-chevron{width:18px;height:18px;color:#758aa8;transition:transform .2s}
.category-trigger:hover,.category-trigger[aria-expanded=true]{filter:none;background:#fff;border-color:#7eaff5;box-shadow:0 0 0 3px #0665ff09}
.category-trigger[aria-expanded=true] .select-chevron{transform:rotate(180deg)}
.category-options{position:absolute;top:calc(100% + 7px);left:0;width:max(100%,230px);padding:6px;background:#fff;border:1px solid #d9e5f4;border-radius:12px;box-shadow:0 12px 32px #103d761a,0 3px 8px #103d7608}
.category-options[hidden]{display:none}
.category-option{width:100%;display:flex;align-items:center;gap:11px;padding:12px 10px;border-radius:7px;text-align:left;font-size:.8rem;font-weight:500;color:#526580;white-space:nowrap}
.category-option>svg{width:20px;height:20px;color:#7b92af}
.category-option>span{flex:1}
.category-option .option-check{width:17px;height:17px;visibility:hidden;color:var(--blue)}
.category-option[aria-selected=true]{background:#edf5ff;color:var(--blue);font-weight:600}
.category-option[aria-selected=true]>svg{color:var(--blue)}
.category-option[aria-selected=true] .option-check{visibility:visible}
.category-option:hover,.category-option:focus-visible{background:#f0f6ff;filter:none;outline:none;box-shadow:inset 0 0 0 1px #bed6fa}
.mascot{animation:none;gap:6px;isolation:isolate;border-radius:18px}
.mascot:hover{filter:none}
.speech{align-self:center;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;line-height:1.3;background:#fff;border:1px solid #bed6f7;border-radius:12px;padding:10px 13px;font-size:clamp(13px,.84rem,18px);color:#1754a2;font-weight:600;box-shadow:0 4px 16px #1239660d;margin:0;z-index:2;transition:border-color .2s,box-shadow .2s,transform .2s}
.speech:after{width:9px;height:9px;bottom:-5px;left:calc(50% - 5px);background:#fff;border:0;border-right:1px solid #bed6f7;border-bottom:1px solid #bed6f7;transform:rotate(45deg)}
.speech>svg{width:15px;height:15px;color:#6a91c5}
.speech-dot{width:6px;height:6px;border-radius:50%;background:#2788ff;box-shadow:0 0 0 3px #eaf3ff}
.mascot:hover .speech,.mascot:focus-visible .speech{border-color:#83b2f1;box-shadow:0 5px 18px #0665ff15;transform:translateY(-2px)}
.mascot-stage{position:relative;display:block;width:100%;aspect-ratio:1}
.mascot-art{position:relative;display:block;width:100%;height:100%;overflow:visible;stroke:none;filter:drop-shadow(0 6px 7px #174f8b0c);transform-origin:50% 85%;animation:robot-bob 5s ease-in-out infinite}
.robot-wave{transform-origin:140px 322px;animation:robot-wave 6s ease-in-out infinite}
.robot-signal{opacity:0;animation:robot-signal 3s ease-in-out infinite}
.mascot-shadow{position:absolute;bottom:3%;left:27%;width:51%;height:5%;border-radius:50%;background:radial-gradient(ellipse,#245b9830,transparent 70%);animation:robot-shadow 5s ease-in-out infinite}
.mascot.is-greeting .robot-wave{animation:robot-hello .95s ease-in-out 2}
.mascot.is-greeting .mascot-art{animation:robot-greet 1.9s ease-in-out}
@keyframes robot-bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(1deg)}}
@keyframes robot-wave{0%,8%,42%,100%{transform:rotate(0)}14%,28%{transform:rotate(10deg)}21%,35%{transform:rotate(-8deg)}}
@keyframes robot-hello{0%,100%{transform:rotate(0)}25%,75%{transform:rotate(13deg)}50%{transform:rotate(-10deg)}}
@keyframes robot-greet{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(-8px) rotate(-2deg)}70%{transform:translateY(-4px) rotate(1deg)}}
@keyframes robot-signal{0%,100%{opacity:0}50%{opacity:.35}}
@keyframes robot-shadow{0%,100%{transform:scaleX(1);opacity:.7}50%{transform:scaleX(.8);opacity:.4}}

.history-toggle{display:none}
.history-list{overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--scroll) transparent;padding:0 3px 5px 0}
.history-group+.history-group{margin-top:8px}
.history-group h3{display:flex;align-items:center;gap:7px;margin:0 0 4px;padding:6px 9px;color:var(--muted);font-size:.72rem;font-weight:650}
.history-group h3 svg{color:var(--blue)}
.history-item{display:block;width:100%;padding:6px 10px 6px 27px;border-radius:8px;text-align:left;font-size:.8rem;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-item:hover,.profile-trigger:hover{background:var(--hover);filter:none}
.history-item:focus-visible{outline-offset:-2px}
.history-item[aria-current="true"]{background:var(--selected);font-weight:650}
.profile{padding-top:10px;border-top:1px solid var(--line)}
.profile-trigger{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border-radius:10px;padding:8px}
.profile-avatar{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:50%;background:#9b443e;color:#fff;font-size:12px;font-weight:650}
.profile-summary{flex:1;min-width:0}
.profile-summary strong,.profile-summary small{display:block;white-space:nowrap}
.profile-summary strong{font-size:.82rem}
.profile-summary small{color:var(--muted);font-size:.72rem;margin-top:2px}
.profile-trigger svg{width:16px;color:var(--muted)}
.profile-trigger:has(+.profile-popover:popover-open){background:var(--selected)}
.profile-popover{position:fixed;inset:auto auto var(--profile-edge) var(--profile-left);margin:0;width:min(340px,calc(100vw - 24px));max-height:calc(100dvh - var(--profile-edge) - 12px);overflow:auto;padding:8px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);box-shadow:0 12px 36px #091a3b38}
[data-theme="dark"] .profile-popover{background:var(--panel)}
.profile-header{display:flex;align-items:center;gap:10px;padding:9px 8px 13px;border-bottom:1px solid var(--line)}
.profile-header small{display:block}
.profile-header .close:hover,.profile-details summary:hover{background:var(--hover)}
.profile-details{padding-top:5px}
.profile-details summary{display:flex;align-items:center;gap:9px;padding:9px 8px;border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:600;list-style:none}
.profile-details summary::-webkit-details-marker{display:none}
.profile-details summary .profile-chevron{margin-left:auto;width:15px;color:var(--muted)}
.profile-details[open] .profile-chevron{transform:rotate(90deg)}
.profile-details dl{margin:0;padding:6px 9px 10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;font-size:.73rem;line-height:1.5}
.profile-details dt{color:var(--muted)}
.profile-details dd{margin:0;overflow-wrap:anywhere}
.profile-details a{color:var(--blue)}
.theme-toggle{position:fixed;right:16px;bottom:14px;z-index:5;display:flex;align-items:center;gap:6px;padding:7px 11px;border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);font-size:12px;box-shadow:0 2px 9px #0b274418}
.theme-toggle svg{width:16px;height:16px;color:var(--blue)}
.mascot{bottom:60px}
[data-theme="dark"] .main,[data-theme="dark"] .composer-wrap,[data-theme="dark"] dialog{background:var(--surface)}
[data-theme="dark"] .topbar{background:linear-gradient(100deg,#182e4a,#15233a)}
[data-theme="dark"] .brand{color:#cfe3ff}
[data-theme="dark"] .new-chat,[data-theme="dark"] .category-trigger,[data-theme="dark"] .category-options,
[data-theme="dark"] .example,[data-theme="dark"] .welcome-category,[data-theme="dark"] .welcome-hint,
[data-theme="dark"] .source-card,[data-theme="dark"] .helpdesk-button,[data-theme="dark"] .helpdesk-reply,
[data-theme="dark"] .speech,[data-theme="dark"] .speech:after,[data-theme="dark"] .composer{background:var(--panel);border-color:var(--line)}
[data-theme="dark"] .tabs,[data-theme="dark"] dialog{border-color:var(--line)}
[data-theme="dark"] .category-option[aria-selected="true"],[data-theme="dark"] .user-bubble,[data-theme="dark"] .user-avatar{background:var(--selected)}
[data-theme="dark"] .category-option:hover,[data-theme="dark"] .category-option:focus-visible,
[data-theme="dark"] .action:hover,[data-theme="dark"] .action[aria-pressed="true"],
[data-theme="dark"] .helpdesk-button:hover,[data-theme="dark"] .helpdesk-button[aria-pressed="true"]{background:var(--hover)}
[data-theme="dark"] .category-option,[data-theme="dark"] .field-label,[data-theme="dark"] .welcome p,
[data-theme="dark"] .welcome-hint,[data-theme="dark"] .eyebrow,[data-theme="dark"] .speech,
[data-theme="dark"] .tab:not(.active) svg,[data-theme="dark"] .action,[data-theme="dark"] .close,
[data-theme="dark"] .composer-note,[data-theme="dark"] textarea::placeholder{color:var(--muted)}
[data-theme="dark"] .send{background:#2464c4;color:#fff}
[data-theme="dark"] .avatar{background:#c0d5f1}
[data-theme="dark"] .chat{scrollbar-color:var(--scroll) transparent}
@media(min-width:761px) and (max-height:720px){
 .sidebar{padding-top:16px}.brand{margin-bottom:18px}.new-chat,.select-wrap{margin-bottom:16px}
 .sidebar h2{margin-bottom:8px}.example{padding-block:9px}.history{margin-top:11px;padding-top:8px}
}
@media(max-width:760px){
 .sidebar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:10px 14px}
 .new-chat{justify-self:end}
 .profile{grid-column:2;grid-row:3;padding:0;border:0;justify-self:end}
 .profile-trigger{width:auto;padding:2px 5px;gap:6px}
 .profile-avatar{width:25px;height:25px;font-size:10px}
 .profile-trigger .profile-summary small{display:none}
 .history{display:contents}
 .sidebar .history-heading{display:none}
 .history-toggle{display:flex;align-items:center;gap:6px;grid-column:1;grid-row:3;justify-self:start;padding:4px 6px;font-size:13px;border-radius:7px}
 .history-toggle[aria-expanded="true"]{background:var(--selected)}
 .history-list{display:none;grid-column:1/-1;max-height:24dvh}
 .history-toggle[aria-expanded="true"]+.history-list{display:block}
 .profile-popover{inset:var(--profile-edge) 12px auto auto}
 .theme-toggle{right:10px;bottom:12px;padding:6px 8px}
 .mascot{bottom:52px}
}

<script>
'use strict';
// 演示内容统一维护：问题、回答、匹配规则与引用来源均按知识分类独立定义。
const KNOWLEDGE = {
 it:{
  name:'IT Helpdesk',icon:'headset',
  exampleLabel:'7号会议室怎么开会？',
  question:'在上海滩（佑越事务所303 7号会议室）怎么开会？如何加入 Teams 会议和投屏？',
  placeholder:'请输入 IT 问题，例如：7号会议室怎么开会？',
  title:'佑越事务所会议室连接方式示意图 · P1',
  sourceFile:'佑越事务所会议室连接方式示意图.pdf#page=1',
  answer:'在上海滩（佑越事务所303 7号会议室），可以任选一种方式加入 Teams 会议。\n\n1. 用 MAXHUB 直接入会：在 MAXHUB 上以访客身份加入 Teams 会议。\n2. 用员工电脑入会并投屏：在电脑上加入 Teams 会议，将 MAXHUB 投屏器插入电脑的 USB 接口，即可无线投屏共享资料。现场收声和声音播放由 MAXHUB 负责。\n\n如需中日双语字幕，可在 MAXHUB 上运行 Felo。Felo 接收 Teams 会议音频和现场声音，并通过 HDMI 将字幕输出到竖屏副屏。\n\n如需使用 Google Meet，当前环境需启用 OpenVPN，且 Felo 字幕不可用。',
  matches:q=>/((?:7|七)号会议室|会议室(?:7|七)|上海滩)/.test(q)&&/(开会|会议|投屏|入会|连接|怎么用|如何用|接入|加入|使用方法)/.test(q)
 },
 hr:{
  name:'HR规章制度',icon:'people',exampleLabel:'请假怎么申请？',
  question:'在公司请假，需要走哪些申请流程？',
  placeholder:'请输入人事相关问题，例如：请假怎么申请？',
  title:'B0002就业规则（CN）Rev.12 · 7-4 请假流程',
  sourceFile:'B0002就业规则（CN）Rev.12.pdf#page=29',
  answer:'根据《B0002就业规则（CN）Rev.12》第 7-4 节，请假按以下流程办理。\n\n1. 提前请假：先填写《请假申请单》，经部门长批准并报人事部备案后，方可休假。\n2. 突发情况：尽快通过电话或其他方式告知部门长并取得同意，返岗当天尽快补办请假手续。\n3. 提前返岗或需要延长假期：到人事部办理销假或续假手续。',
  matches:q=>/(请假|休假)/.test(q)&&/(怎么|如何|流程|手续|申请|制度)/.test(q)&&!/(天数|几天|多少天|工资|薪资)/.test(q)
 },
 product:{
  name:'EBARA 技术知识库',icon:'document',
  question:'电子显微镜的真空腔体需要清洁抽气，现场没有冷却水。气镇必须开启，腔体工作压力要求不高于 2 Pa，EV-SA 系列应该优先评估哪款？',
  placeholder:'请输入机型和报警，例如：EV-M502NS 报 COMM ERROR 且 CP1 跳闸',
  title:'EBARA Catalog 24.2.19 ziped 1',
  sourceFile:'EBARA Catalog 24.2.19 ziped 1.pdf#page=5',
  answer:[
   '建议优先评估 EV-SA50。根据目录印刷页第 7 页的规格表，EV-SA 是无需冷却水的风冷干式真空泵，适用于电子显微镜等清洁抽气场景。按气镇开启时的目录极限压力初筛，三款中只有 EV-SA50 低于 2 Pa。',
   '1. 核对气镇条件下的规格\n• EV-SA20：最大抽气速率 1,670 L/min，极限压力 3.0 Pa（气镇关）／5.0 Pa（气镇开）。\n• EV-SA30：最大抽气速率 3,300 L/min，极限压力 2.0 Pa（气镇关）／3.0 Pa（气镇开）。\n• EV-SA50：最大抽气速率 5,000 L/min，极限压力 0.5 Pa（气镇关）／1.0 Pa（气镇开）。',
   '2. 用腔体工况复核候选型号\nEV-SA30 的 2.0 Pa 对应气镇关闭，开启后为 3.0 Pa。EV-SA50 在气镇开启时的 1.0 Pa 是目录极限压力。带载运行时，腔体压力还会受到气体负荷、漏气、放气以及泵前管路流导的影响。5,000 L/min 是目录最大抽气速率，评估 2 Pa 工况时应使用该压力附近的抽速曲线，并计入管路对腔体端有效抽速的影响。',
   '3. 确认安装与验收条件\nEV-SA50 的外形尺寸为 317 × 650 × 538 mm（宽 × 深 × 高），重量为 150 kg。安装前核对承重、进排风空间和管路接口。定型前，在气镇持续开启、代表性气体负荷及实际管路配置下，于腔体侧测量稳态压力，并记录抽空至 2 Pa 所需时间。以腔体侧能否稳定维持 ≤ 2 Pa 作为压力验收依据。'
  ].join('\n\n'),
  matches:q=>q==='气镇开启时，EV-SA怎么选？'||(/EV-?SA/i.test(q)&&/气镇(?:开启|打开|ON)/i.test(q)&&/(?<![\d.])2Pa\b/i.test(q)&&/(选型|怎么选|如何选|哪款|型号)/.test(q))

function readPreference(key){try{return localStorage.getItem(key);}catch{return null;}}
function writePreference(key,value){try{localStorage.setItem(key,value);}catch{}}
function createConversation(category){return {category,title:'',messages:[],draft:'',scroll:0};}
function readHistory(){
 try{
  const saved=JSON.parse(readPreference(HISTORY_KEY));
  if(!Array.isArray(saved))return [];
  return saved.map(thread=>({
   ...thread,draft:'',scroll:0,
   messages:thread.messages.map(m=>['loading','typing'].includes(m.status)?{...m,status:'stopped'}:m)
  }));
 }catch{return [];}
}

function sampleConversation(category,{id,sampleId,title,turns},index){
 return {
  ...createConversation(category),sampleId:sampleId??category+'-'+(id??index),title,
  messages:turns.flatMap(([question,answer])=>[
   {role:'user',text:question},
   {role:'assistant',category,text:answer,citation:true,sourceId:id,status:'complete',vote:null}
  ])
 };
}
const examples=Object.fromEntries(Object.entries(HISTORY_CASES).map(([category,cases])=>[
 category,cases.map((entry,index)=>sampleConversation(category,entry,index))
]));
const sessions=Object.fromEntries(Object.keys(KNOWLEDGE).map(id=>[id,createConversation(id)]));
let current='it',job=null,composing=false,compositionEnded=0,follow=true,toastTimer;
const chat=$('chat'),messages=$('messages'),input=$('question'),send=$('send'),dialog=$('sourceDialog');
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function icon(name){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('aria-hidden','true');const u=document.createElementNS(s.namespaceURI,'use');u.setAttribute('href','#'+name);s.append(u);return s;}
function avatar(){const img=el('img','avatar');img.src=ROBOT;img.alt='SEPM机器人';return img;}
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2600);}
function announce(text){$('announcement').textContent=text;}
function saveHistory(){
 writePreference(HISTORY_KEY,JSON.stringify(recent.map(({category,title,sampleId,messages})=>({category,title,sampleId,messages}))));
}
function renderHistory(){
 const list=$('historyList');
 const scroll=list.scrollTop;
 const focused=document.activeElement?.thread;
 const continuedSamples=new Set(recent.map(thread=>thread.sampleId));
 list.replaceChildren();
 for(const [category,d] of Object.entries(KNOWLEDGE)){
  const group=el('section','history-group');
  const heading=el('h3');
  heading.append(icon(d.icon),document.createTextNode(d.name));
  group.append(heading);
  const threads=[
   ...recent.filter(thread=>thread.category===category),
   ...examples[category].filter(thread=>!continuedSamples.has(thread.sampleId))
  ];
  for(const thread of threads){
   const button=el('button','history-item',thread.title);
   button.type='button';
   button.title=thread.title;
   button.thread=thread;
   if(thread===sessions[current])button.setAttribute('aria-current','true');
   button.onclick=()=>{
    showConversation(thread);
    const toggle=$('historyToggle');
    if(toggle.getAttribute('aria-expanded')==='true'){
     toggle.setAttribute('aria-expanded','false');
     toggle.focus({preventScroll:true});
    }
   };
   group.append(button);
  }
  list.append(group);
 }
 list.scrollTop=scroll;
 if(focused)Array.from(list.querySelectorAll('.history-item')).find(button=>button.thread===focused)?.focus({preventScroll:true});
}
function setTheme(theme){
 const dark=theme==='dark';
 document.documentElement.dataset.theme=theme;
 const toggle=$('themeToggle');
 toggle.setAttribute('aria-label',dark?'切换到浅色模式':'切换到深色模式');
 toggle.replaceChildren(icon(dark?'sun-icon':'moon-icon'),el('span','',dark?'浅色':'深色'));
}
setTheme(readPreference(THEME_KEY)==='dark'?'dark':'light');
$('themeToggle').onclick=()=>{
 const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
 setTheme(theme);
 writePreference(THEME_KEY,theme);
};
$('historyToggle').onclick=event=>{
 const toggle=event.currentTarget;
 toggle.setAttribute('aria-expanded',String(toggle.getAttribute('aria-expanded')==='false'));
};
const profilePopover=$('profilePopover');
function positionProfilePopover(){
 const trigger=$('profileButton').getBoundingClientRect();
 const edge=matchMedia('(max-width:760px)').matches?trigger.bottom:document.documentElement.clientHeight-trigger.top;
 profilePopover.style.setProperty('--profile-edge',edge+8+'px');
 profilePopover.style.setProperty('--profile-left',trigger.left+'px');
}
profilePopover.addEventListener('beforetoggle',event=>{
 if(event.newState==='open')positionProfilePopover();
});
window.addEventListener('resize',()=>{
 if(profilePopover.matches(':popover-open'))positionProfilePopover();
});
function resizeInput(){input.style.height='52px';input.style.height=Math.min(input.scrollHeight,122)+'px';}
function syncSend(){const busy=!!job;send.disabled=!busy&&!input.value.trim();send.classList.toggle('is-stop',busy);send.replaceChildren(icon(busy?'stop-icon':'send-icon'),el('span','',busy?'停止生成':'发送'));send.setAttribute('aria-label',busy?'停止生成':'发送问题');}
function bottom(){if(follow)chat.scrollTop=chat.scrollHeight;}
chat.addEventListener('scroll',()=>{follow=chat.scrollHeight-chat.scrollTop-chat.clientHeight<70;});
function openSource(source){
 if(source.sourceFile){
  window.open(source.sourceFile,'_blank','noopener');
  return;
 }
 $('docTitle').textContent=source.title;
 $('docCategory').textContent=source.name+' · 本地演示资料';
 $('docBody').textContent=source.document;
 dialog.showModal();
}
$('closeDialog').onclick=()=>dialog.close();
dialog.addEventListener('click',e=>{
 if(e.target!==dialog)return;
 const bounds=dialog.getBoundingClientRect();
 if(e.clientX<bounds.left||e.clientX>bounds.right||e.clientY<bounds.top||e.clientY>bounds.bottom)dialog.close();
});
async function copyText(text){try{const prev=document.activeElement;const area=el('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);let ok=false;try{area.focus();area.select();ok=document.execCommand('copy');}catch{}finally{area.remove();prev?.focus({preventScroll:true});}if(ok){toast('回答已复制');return;}if(navigator.clipboard&&window.isSecureContext){let timeout;try{await Promise.race([navigator.clipboard.writeText(text),new Promise((_,reject)=>{timeout=setTimeout(()=>reject(new Error('timeout')),1200);})]);toast('回答已复制');return;}catch{}finally{clearTimeout(timeout);}}toast('复制失败，请选中回答正文后按 Ctrl+C');}catch{toast('复制失败，请选中回答正文后按 Ctrl+C');}}
function addActions(container,m){const actions=el('div','actions');const copy=el('button','action');copy.title='复制回答';copy.setAttribute('aria-label','复制回答');copy.append(icon('copy-icon'));copy.onclick=()=>copyText(m.text);actions.append(copy);const votes=[];['up','down'].forEach((v,i)=>{const b=el('button','action');b.title=i?'点踩':'点赞';b.setAttribute('aria-label',b.title);b.setAttribute('aria-pressed',String(m.vote===v));b.append(icon(v+'-icon'));b.onclick=()=>{m.vote=m.vote===v?null:v;votes.forEach(([node,value])=>node.setAttribute('aria-pressed',String(m.vote===value)));toast(m.vote?(m.vote==='up'?'感谢认可，已记录本次演示反馈':'感谢反馈，已记录本次演示意见'):'已取消反馈');};votes.push([b,v]);actions.append(b);});container.append(actions);}
function addHelpdeskFeedback(container,m){
 const isHr=m.category==='hr';
 const isProduct=m.category==='product';
 const controls=el('div','helpdesk-actions');
 const reply=el('div','helpdesk-reply');
 reply.setAttribute('role','status');
 function showReply(){
  reply.replaceChildren();
  reply.hidden=!m.feedback;
  if(m.feedback==='resolved'){
   reply.textContent=(isHr||isProduct)?'很高兴能帮到您，祝您工作顺利！':'很高兴问题已经解决，祝您开会顺利！';
  }else if(m.feedback==='contact'&&m.sourceId===REPAIR_CASE.id){
   reply.textContent='请按现场流程联系当班设备负责人或 FE 技术支持，并附上机型、报警日志、CP1 状态和排查结果。';
  }else if(m.feedback==='contact'&&isProduct){
   const email=el('a','','junyi.zhou@sepm-ebara.com');
   email.href='mailto:junyi.zhou@sepm-ebara.com';
   reply.append('如需进一步了解产品选型或技术细节，请联系售前技术专家周君一。',el('br'),'邮箱 ',email);
  }else if(m.feedback==='contact'&&isHr){
   reply.append('如需进一步协助，请联系人事担当 XXX。',el('br'),'邮箱 XXX@sepm-ebara.com');
  }else if(m.feedback==='contact'){
   const email=el('a','','haojun.zhang@sepm-ebara.com');
   email.href='mailto:haojun.zhang@sepm-ebara.com';
   const phone=el('a','','18018694427');
   phone.href='tel:18018694427';
   reply.append('如需进一步协助，请联系 7 号会议室的 IT 负责人张浩鋆。',el('br'),'邮箱 ',email,el('br'),'手机 ',phone);
  }
  controls.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.feedback===m.feedback)));
 }
 for(const [value,label] of [['resolved','已解决'],['contact',isProduct?'联系技术':isHr?'联系人事':'联系IT']]){
  const button=el('button','helpdesk-button',label);
  button.type='button';
  button.dataset.feedback=value;
  button.onclick=()=>{m.feedback=value;showReply();reply.scrollIntoView({block:'nearest'});};
  controls.append(button);
 }
 container.append(reply,controls);
 showReply();
}
function finishAnswer(container,m){
 if(m.status==='stopped'){
  container.append(el('div','stopped','已停止生成，可继续提问。'));
  return;
 }
 if(m.citation){
  const isRepair=m.sourceId===REPAIR_CASE.id;
  const source=isRepair?REPAIR_CASE.source:KNOWLEDGE[m.category];
  const cite=el('button','inline-cite','[1]');
  cite.setAttribute('aria-label','引用1：'+source.title);
  cite.onclick=()=>openSource(source);
  container.querySelector('.answer-text').append(cite);
  const sources=el('div','sources');
  sources.append(el('h3','','引用来源'));
  const card=el('div','source-card');
  card.append(el('span','pdf','PDF'));
  const title=el('div','source-title');
  const num=el('button','cite','[1]');
  num.setAttribute('aria-label','打开引用1');
  num.onclick=()=>openSource(source);
  title.append(num,document.createTextNode(' '+source.title));
  const view=el(source.sourceFile?'a':'button','view-source',isRepair?'打开 PDF':'查看原文');
  if(source.sourceFile){
   view.href=source.sourceFile;
   view.target='_blank';
   view.rel='noopener';
  }else view.onclick=()=>openSource(source);
  card.append(title,view);
  sources.append(card);
  container.append(sources);
 }
 if(m.nextQuestion&&m===sessions[m.category].messages.at(-1)){
  const followUp=el('div','helpdesk-actions');
  followUp.append(caseButton('追问 · '+m.nextQuestion,()=>fillExample(m.nextQuestion)));
  container.append(followUp);
 }
 addActions(container,m);
 if(m.citation)addHelpdeskFeedback(container,m);
}
function caseButton(label,action){
 const button=el('button','helpdesk-button',label);
 button.type='button';
 button.onclick=action;
 return button;
}
function productQuestions(){
 const card=el('div','welcome-hint');
 const list=el('ul','question-examples');
 for(const entry of HISTORY_CASES.product){
  const row=el('li');
  row.append(caseButton(entry.exampleLabel,()=>fillExample(entry.turns[0][0])));
  if(entry===REPAIR_CASE){
   row.append(caseButton('查看完整演示',()=>showConversation(sampleConversation('product',entry))));
  }
  list.append(row);
 }
 card.append(el('strong','','示例问题'),list);
 return card;
}
function drawAnswer(m){const row=el('article','answer-row');row.append(avatar());const content=el('div','answer');content.append(el('div','assistant-name','SEPM AI助手'));const text=el('div','answer-text',m.text);content.append(text);if(m.status==='loading'){const loading=el('div','loading');const dots=el('span','dots');for(let i=0;i<3;i++)dots.append(el('i'));loading.append(dots,el('span','','正在查找示例资料…'));content.append(loading);}else if(m.status==='typing')text.classList.add('typing');else finishAnswer(content,m);row.append(content);messages.append(row);return{content,text};}
function render(){
 messages.replaceChildren();
 const s=sessions[current],d=KNOWLEDGE[current];
 if(!s.messages.length){
  const welcome=el('div','welcome');
  const head=el('div','welcome-head');
  const title=el('div');
  title.append(el('h2','','你好，我是 SEPM AI助手'),el('div','eyebrow','让知识触手可及'));
  head.append(avatar(),title);
  const badge=el('div','welcome-category');
  badge.append(icon(d.icon),document.createTextNode(d.name));
  const prompt=current==='product'?'选择示例问题，点击发送，即可查看回答和引用资料。':'欢迎体验知识库问答。选择左侧示例问题，点击发送，即可观看回答并查看引用资料。';
  welcome.append(head,badge,el('p','',prompt));
  if(current==='product')welcome.append(productQuestions());
  else{
   const hint=el('div','welcome-hint');
   hint.append(el('strong','','试着问我：'),el('div','',d.question));
   welcome.append(hint);
  }
  messages.append(welcome);
 }else{
  for(const m of s.messages){
   if(m.role==='user'){
    const row=el('article','user-row');
    const a=el('span','user-avatar');
    a.append(icon('user-icon'));
    row.append(el('div','user-bubble',m.text),a);
    messages.append(row);
   }else drawAnswer(m);
  }
 }
 chat.setAttribute('aria-label',d.name+' 对话记录');
}
function stopGeneration(){
 if(!job)return;
 clearTimeout(job.timer);
 job.message.status='stopped';
 job=null;
 saveHistory();
 render();
 syncSend();
 announce('已停止生成');
}
function showConversation(thread){
 const previous=sessions[current];
 if(thread===previous)return;
 previous.draft=input.value;
 previous.scroll=chat.scrollTop;
 stopGeneration();
 current=thread.category;
 sessions[current]=thread;
 const d=KNOWLEDGE[current];
 $('category').value=current;
 $('categoryName').textContent=d.name;
 categoryOptions.forEach(option=>option.setAttribute('aria-selected',String(option.dataset.value===current)));
 closeCategoryMenu();
 $('selectIcon').setAttribute('href','#'+d.icon);
 document.querySelectorAll('.tab').forEach(tab=>{
  const active=tab.dataset.category===current;
  tab.classList.toggle('active',active);
  tab.setAttribute('aria-pressed',String(active));
 });
 $('exampleText').textContent=current==='product'?HISTORY_CASES.product[0].exampleLabel:d.exampleLabel;
 input.placeholder=d.placeholder;
 input.value=thread.draft;
 resizeInput();
 render();
 renderHistory();
 chat.scrollTop=thread.scroll;
 follow=chat.scrollHeight-chat.scrollTop-chat.clientHeight<70;
 syncSend();
 announce(thread.title?'已打开对话：'+thread.title:'已切换至'+d.name);
}
function switchCategory(id){showConversation(sessions[id]);}
function focusInput(){input.focus({preventScroll:true});input.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'nearest'});}
function submit(){
 if(job){stopGeneration();toast('已停止生成');return;}
 if(composing)return;
 const q=input.value.trim();
 if(!q){syncSend();return;}
 const category=current,d=KNOWLEDGE[category],thread=sessions[category];
 const fullQuestion=q.replace(/\s+/g,'');
 const scriptedTurns=HISTORY_CASES[category].flatMap(entry=>entry.turns.map(([question,answer],index)=>({
  question,answer,sourceId:entry.id,nextQuestion:entry.id?entry.turns[index+1]?.[0]:undefined
 })));
 const scriptedTurn=scriptedTurns.find(({question})=>question.replace(/\s+/g,'')===fullQuestion)
  ??(category==='product'&&REPAIR_CASE.matches(fullQuestion)?scriptedTurns.find(turn=>turn.sourceId===REPAIR_CASE.id):undefined);
 const answer=scriptedTurn?.answer??((d.question===q||d.matches(fullQuestion))?d.answer:undefined);
 const full=answer??FALLBACK;
 const m={role:'assistant',category,text:'',citation:!!answer,status:'loading',vote:null,
  sourceId:scriptedTurn?.sourceId,nextQuestion:scriptedTurn?.nextQuestion};
 thread.messages.push({role:'user',text:q},m);
 thread.title||=q.replace(/\s+/g,' ');
 const previousIndex=recent.indexOf(thread);
 if(previousIndex!==-1)recent.splice(previousIndex,1);
 recent.unshift(thread);
 saveHistory();
 renderHistory();
 input.value='';
 thread.draft='';
 resizeInput();
 follow=true;
 render();
 bottom();
 const generation={message:m,timer:null};
 job=generation;
 syncSend();
 announce('正在查找示例资料');
 generation.timer=setTimeout(()=>{
  if(job!==generation)return;
  m.status='typing';
  render();
  const target=messages.lastElementChild.querySelector('.answer-text');
  let offset=0;
  function tick(){
   if(job!==generation)return;
   offset+=4;
   m.text=full.slice(0,offset);
   target.textContent=m.text;
   if(offset<full.length){
    generation.timer=setTimeout(tick,24);
   }else{
    m.status='complete';
    target.classList.remove('typing');
    finishAnswer(target.parentElement,m);
    job=null;
    saveHistory();
    syncSend();
    announce('回答已完成'+(m.citation?'，可查看引用资料':''));
   }
   bottom();
  }
  tick();
 },500);
}
$('composer').addEventListener('submit',e=>{e.preventDefault();submit();});
input.addEventListener('input',()=>{sessions[current].draft=input.value;resizeInput();syncSend();});
input.addEventListener('compositionstart',()=>{composing=true;});input.addEventListener('compositionend',()=>{composing=false;compositionEnded=performance.now();});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){if(e.isComposing||composing||e.keyCode===229||performance.now()-compositionEnded<100)return;e.preventDefault();if(!job)submit();}});
$('newChat').onclick=()=>{showConversation(createConversation(current));toast('已开始新对话');focusInput();};
function fillExample(question){input.value=question;sessions[current].draft=input.value;resizeInput();syncSend();focusInput();toast('示例已填入，点击“发送”开始体验');}
$('example').onclick=()=>fillExample(current==='product'?HISTORY_CASES.product[0].turns[0][0]:KNOWLEDGE[current].question);
const categoryButton=$('category'),categoryMenu=$('categoryOptions');
const categoryOptions=Array.from(categoryMenu.querySelectorAll('[role=option]'));
function closeCategoryMenu(restoreFocus=false){categoryMenu.hidden=true;categoryButton.setAttribute('aria-expanded','false');if(restoreFocus)categoryButton.focus({preventScroll:true});}
function openCategoryMenu(index=categoryOptions.findIndex(option=>option.dataset.value===current)){categoryMenu.hidden=false;categoryButton.setAttribute('aria-expanded','true');categoryOptions[Math.max(0,index)].focus({preventScroll:true});}
categoryButton.onclick=()=>categoryMenu.hidden?openCategoryMenu():closeCategoryMenu();
categoryButton.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();openCategoryMenu();}else if(e.key==='Escape')closeCategoryMenu();});
categoryOptions.forEach((option,index)=>{
 option.onclick=()=>{switchCategory(option.dataset.value);closeCategoryMenu(true);};
 option.addEventListener('keydown',e=>{
  let next=index;
  if(e.key==='ArrowDown')next=(index+1)%categoryOptions.length;
  else if(e.key==='ArrowUp')next=(index-1+categoryOptions.length)%categoryOptions.length;
  else if(e.key==='Home')next=0;
  else if(e.key==='End')next=categoryOptions.length-1;
  else if(e.key==='Escape'){e.preventDefault();closeCategoryMenu(true);return;}
  else if(e.key==='Tab'){closeCategoryMenu(true);return;}
  else return;
  e.preventDefault();categoryOptions[next].focus({preventScroll:true});
 });
});
document.addEventListener('click',e=>{if(!$('categoryPicker').contains(e.target))closeCategoryMenu();});
$('categoryPicker').addEventListener('focusout',e=>{if(!e.currentTarget.contains(e.relatedTarget))closeCategoryMenu();});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchCategory(t.dataset.category));
let greetingTimer;
function greet(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const mascot=$('mascot');if(mascot.classList.contains('is-greeting'))return;mascot.classList.add('is-greeting');clearTimeout(greetingTimer);greetingTimer=setTimeout(()=>mascot.classList.remove('is-greeting'),1900);}
$('mascot').addEventListener('pointerenter',greet);
$('mascot').addEventListener('focus',greet);
$('mascot').onclick=()=>{greet();focusInput();toast('你好，我是SEPM AI助手，请输入问题或选择左侧示例。');};
$('mascotArtwork').setAttribute('href',ROBOT);
document.querySelectorAll('.robot').forEach(img=>img.src=ROBOT);$('exampleText').textContent=KNOWLEDGE.it.exampleLabel;input.placeholder=KNOWLEDGE.it.placeholder;render();renderHistory();syncSend();
</script>
